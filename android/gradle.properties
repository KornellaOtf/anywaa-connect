# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the command line, check
# build.gradle files instead.
# When configured, Gradle will run in daemon mode.
# See more details here: https://docs.gradle.org/current/userguide/daemon_mode.html
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.workers.max=8

# AndroidX package structure to make it clearer which packages are being used
android.useAndroidX=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enable R8 full mode (false by default, requires full classpath for type inference)
android.enableR8.fullMode=false

# Gradle memory settings
org.gradle.jvmargs=-Xmx4096m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Disable pre-release Gradle features
android.suppressUnsupportedCompileSdkWarning=false
