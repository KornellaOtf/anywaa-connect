name: Build Full Android APK (Debug)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Restore full app build.gradle.kts from backup (CI-only)
        run: |
          cd android
          if [ -f app/build.gradle.kts.backup ]; then
            mv -f app/build.gradle.kts.backup app/build.gradle.kts
          fi
          # Ensure the stub build.gradle is not used in CI
          rm -f app/build.gradle

      - name: Clean and build debug APK
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-full-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
